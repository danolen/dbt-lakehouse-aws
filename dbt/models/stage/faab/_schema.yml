version: 2

models:
  - name: int_faab_bid_bucket_context
    description: >-
      Per-league roster-gap and FA-scarcity flags for bid_bucket (#61).
      Grain is league. Lives in stage (not an app-facing mart). gap_* is 0
      when no owner matches owner_name_pattern (cash leagues without
      "Nolen"). Does not feed the optimizer.
    columns:
      - name: league
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('league_config')
                field: league

  - name: int_faab_bid_bucket
    description: >-
      Slim classification harness for dbt unit tests of faab_bid_bucket
      (#61 / A6.3). Empty in production; mart_faab_worksheet applies the
      same macro. Observability only. Not queried by Streamlit.
    columns:
      - name: bid_bucket
        data_tests:
          - accepted_values:
              arguments:
                values: ['triage', 'tactical', 'strategic']
