version: 2

# Slim-model unit tests for bid_bucket (#61 / A6.3). Do not mock the full
# mart_faab_worksheet join — only the CASE inputs.

unit_tests:
  - name: test_faab_bid_bucket_agreed_cases
    description: >-
      Agreed #61 cases: gap+cheap→triage; expensive+ugly RoS→strategic;
      expensive+gap→strategic; no FTN + own 92 + positive RoS→strategic;
      no FTN + low own + gap→triage; no FAAB→null; cheap no gap→tactical;
      no FTN + high own + negative RoS no gap→tactical; borderline+scarce
      →strategic; no FTN + high own + negative RoS + gap→triage.
    model: int_faab_bid_bucket
    given:
      - input: ref('int_faab_bid_bucket_inputs')
        format: sql
        rows: |
          select
            cast('gap_cheap_ftn' as varchar) as case_id,
            1 as has_faab,
            1 as has_ftn_rec,
            3 as high_bid,
            cast(0.5 as double) as high_bid_pct_of_faab,
            5 as own_pct,
            cast(-4.0 as double) as ros_value,
            1 as fills_roster_gap,
            0 as is_scarce_position
          union all
          select
            'expensive_ugly_ros',
            1, 1, 80, cast(18.0 as double), 2, cast(-12.0 as double), 0, 0
          union all
          select
            'expensive_plus_gap',
            1, 1, 80, cast(18.0 as double), 8, cast(-3.0 as double), 1, 0
          union all
          select
            'no_ftn_high_own_pos_ros',
            1, 0, cast(null as int), cast(null as double), 92, cast(4.5 as double), 0, 0
          union all
          select
            'no_ftn_low_own_gap',
            1, 0, cast(null as int), cast(null as double), 12, cast(-1.0 as double), 1, 0
          union all
          select
            'no_faab_50s',
            0, 1, 40, cast(null as double), 20, cast(2.0 as double), 1, 0
          union all
          select
            'cheap_no_gap',
            1, 1, 3, cast(0.5 as double), 8, cast(1.0 as double), 0, 0
          union all
          select
            'no_ftn_high_own_neg_ros_no_gap',
            1, 0, cast(null as int), cast(null as double), 92, cast(-6.0 as double), 0, 0
          union all
          select
            'borderline_scarce',
            1, 1, 18, cast(4.0 as double), 15, cast(0.5 as double), 0, 1
          union all
          select
            'no_ftn_high_own_neg_ros_gap',
            1, 0, cast(null as int), cast(null as double), 92, cast(-6.0 as double), 1, 0
      - input: ref('faab_bid_bucket_thresholds')
        rows:
          - cheap_high_bid_max: 5.0
            cheap_pct_of_faab_max: 2.0
            expensive_high_bid_min: 25.0
            expensive_pct_of_faab_min: 8.0
            borderline_high_bid_min: 15.0
            high_own_pct_min: 90.0
            scarce_fa_count_max: 3.0
            ros_value_keeper_min: 0.0
            owner_name_pattern: "%nolen%"
    expect:
      rows:
        - {case_id: gap_cheap_ftn, bid_bucket: triage}
        - {case_id: expensive_ugly_ros, bid_bucket: strategic}
        - {case_id: expensive_plus_gap, bid_bucket: strategic}
        - {case_id: no_ftn_high_own_pos_ros, bid_bucket: strategic}
        - {case_id: no_ftn_low_own_gap, bid_bucket: triage}
        - {case_id: no_faab_50s, bid_bucket: null}
        - {case_id: cheap_no_gap, bid_bucket: tactical}
        - {case_id: no_ftn_high_own_neg_ros_no_gap, bid_bucket: tactical}
        - {case_id: borderline_scarce, bid_bucket: strategic}
        - {case_id: no_ftn_high_own_neg_ros_gap, bid_bucket: triage}
